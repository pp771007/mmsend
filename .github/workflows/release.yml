name: release

# Push a tag like v0.1.0 (matching Cargo.toml's version) to build mmsend.exe
# and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/mmsend.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  mmsend.exe" | Out-File -Encoding ascii target/release/mmsend.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/mmsend.exe
            target/release/mmsend.exe.sha256
          generate_release_notes: true
