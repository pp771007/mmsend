[package]
name = "mmsend"
version = "0.3.4"
edition = "2024"
description = "Send Mattermost messages from the Windows command line"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "unicode"] }
# persistence: remembers the window's position and size between runs.
eframe = { version = "0.37.0", features = ["persistence"] }
# Bundled monochrome emoji: the UI's icons look the same on every PC and take the
# text color, instead of depending on whichever color emoji font Windows falls back to.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# native-tls = Schannel: trusts the Windows certificate store, so company-issued
# or TLS-inspection root CAs work without extra setup.
# system-proxy: uses the proxy set in Windows' Internet Settings (it is part of
# the default features turned off here).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "native-tls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = "0.37.0"
